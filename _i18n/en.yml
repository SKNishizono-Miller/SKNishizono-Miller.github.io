        content1: "I am a Research Assistant in Astrodynamics at University College London, where I work on space vehicle flight dynamics, modelling, and software development in collaboration with the European Space Agency (ESA), Eutelsat OneWeb, and RISE."
        content2: "<span class=\"hidden md:inline\" id=\"explain-text\">I hold an MEng in Aerospace Engineering from the University of Bristol. My background includes orbital dynamics, spacecraft systems, aerodynamics, and composite structures, with strong experience in CAD, FEA, and simulation tools. I primarily program in C++, alongside MATLAB and Python, and I hold an Ansys STK Level 2 certification. </span><button id=\"explain-text-toggle\" class=\"md:hidden text-gray-400 underline focus:outline-none\">[Show More]</button><button id=\"explain-text-hide\" class=\"hidden md:hidden text-gray-400 underline focus:outline-none\">[Hide]</button>"

